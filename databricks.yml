bundle:
  name: autonomous-enterprise-architect

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name for the governed architecture twin.
    default: databricks_architect_agent
  schema:
    description: Schema name for the governed architecture twin.
    default: agent_demo

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-1866518241053589.9.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  production:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}