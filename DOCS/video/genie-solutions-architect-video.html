<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genie Solutions Architect Video</title>
  <style>
    :root { --ink:#12363b; --teal:#126b62; --paper:#f4f8f5; --lime:#dbe976; --coral:#e57c59; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:Aptos, "Helvetica Neue", Arial, sans-serif; }
    main { width:min(1120px,94vw); padding:32px 0; }
    h1 { margin:0 0 8px; font:800 clamp(28px,4vw,44px)/1 "Aptos Display", "Helvetica Neue", Arial, sans-serif; }
    p { margin:0 0 20px; color:#567276; }
    canvas { display:block; width:100%; height:auto; background:#e8f2ee; box-shadow:0 16px 38px rgba(14,57,57,.16); }
    button { margin-top:18px; border:0; background:var(--teal); color:#fff; padding:12px 18px; font:800 14px "Aptos Display", "Helvetica Neue", Arial, sans-serif; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { margin-left:12px; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1>Genie Solutions Architect Video</h1>
    <p>A 30-second overview assembled from the published blog graphics. Export creates a local WebM video.</p>
    <canvas id="stage" width="1280" height="720"></canvas>
    <button id="export" type="button">Export 30-second WebM</button><span id="status"></span>
  </main>
  <script>
    const canvas = document.querySelector('#stage');
    const context = canvas.getContext('2d');
    const exportButton = document.querySelector('#export');
    const status = document.querySelector('#status');
    const assets = '../infographics/';
    const slides = [
      { eyebrow:'GOVERNED ARCHITECTURE INTELLIGENCE', title:'GENIE SOLUTIONS\nARCHITECT', copy:'A governed design partner for data, AI, and analytics decisions.', image:'genie_solutions_architect_infographic.svg', seconds:5 },
      { eyebrow:'EVIDENCE BEFORE DESIGN', title:'START WITH THE\nPLATFORM YOU HAVE', copy:'The Genie Agent grounds each option in governed assets, lineage, policy, workload, cost, and semantic context.', image:'solutions_architect_system_topology.svg', seconds:5 },
      { eyebrow:'ONE REUSABLE PATTERN', title:'ANY APPROVED\nBUSINESS DOMAIN', copy:'Retail POS is the test scenario. The same semantic and governance pattern applies across every approved domain.', image:'solutions_architect_semantic_enrollment.svg', seconds:5 },
      { eyebrow:'CURRENT, OFFICIAL GUIDANCE', title:'KNOWLEDGE THAT\nSTAYS CURRENT', copy:'The Knowledge MCP reads allowlisted official Databricks documentation. Fresh research is reviewed before it informs a recommendation.', image:'solutions_architect_knowledge_lifecycle.svg', seconds:5 },
      { eyebrow:'A REAL DESIGN OUTPUT', title:'REVIEWABLE\nARCHITECTURE', copy:'The agent produces a traceable proposal and a diagram based on the request, ontology, policies, dependencies, and reviewed knowledge.', image:'sample_customer_360_solution.svg', seconds:5 },
      { eyebrow:'HUMANS RETAIN CONTROL', title:'PLAN. REVIEW.\nDECIDE.', copy:'Every recommendation remains PENDING_APPROVAL. The system makes tradeoffs visible; people approve what happens next.', image:'genie_solutions_architect_executive_brief.svg', seconds:5 }
    ];
    const imageCache = new Map();
    function loadImage(source) {
      if (imageCache.has(source)) return imageCache.get(source);
      const promise = new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = source;
      });
      imageCache.set(source, promise);
      return promise;
    }
    function contain(image, x, y, width, height) {
      const ratio = Math.min(width / image.width, height / image.height);
      const drawnWidth = image.width * ratio;
      const drawnHeight = image.height * ratio;
      return [x + (width - drawnWidth) / 2, y + (height - drawnHeight) / 2, drawnWidth, drawnHeight];
    }
    function drawWrapped(text, x, y, maxWidth, lineHeight, font) {
      context.font = font;
      let line = '';
      let cursor = y;
      for (const word of text.split(' ')) {
        const candidate = `${line} ${word}`.trim();
        if (line && context.measureText(candidate).width > maxWidth) { context.fillText(line, x, cursor); cursor += lineHeight; line = word; }
        else line = candidate;
      }
      if (line) context.fillText(line, x, cursor);
    }
    async function drawSlide(slide, progress) {
      const image = await loadImage(assets + slide.image);
      const fade = Math.min(1, progress * 4, (1 - progress) * 4);
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#f4f8f5'; context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#0f5d58'; context.fillRect(0, 0, canvas.width, 262);
      context.fillStyle = '#72ddc2'; context.font = '800 14px "Aptos Display", Arial'; context.letterSpacing = '2px'; context.fillText(slide.eyebrow, 66, 58);
      context.fillStyle = '#ffffff'; context.font = '800 50px "Aptos Display", Arial';
      slide.title.split('\n').forEach((line, index) => context.fillText(line, 62, 111 + index * 57));
      context.fillStyle = '#d7ece6'; drawWrapped(slide.copy, 62, 221, 1120, 21, '400 16px Aptos, Arial');
      const [x, y, width, height] = contain(image, 54, 282, 1172, 362);
      context.globalAlpha = fade; context.fillStyle = '#ffffff'; context.fillRect(x - 8, y - 8, width + 16, height + 16); context.drawImage(image, x, y, width, height); context.globalAlpha = 1;
      context.fillStyle = '#557276'; context.font = '700 12px Consolas, monospace'; context.fillText('DATABRICKS SOLUTIONS ARCHITECT | GOVERNED DESIGN, HUMAN APPROVAL', 62, 690);
    }
    async function preview() {
      await drawSlide(slides[0], .5);
    }
    async function exportVideo() {
      exportButton.disabled = true; status.textContent = 'Rendering...';
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType:'video/webm;codecs=vp9' });
      const chunks = []; recorder.ondataavailable = event => chunks.push(event.data);
      const complete = new Promise(resolve => recorder.onstop = resolve);
      recorder.start();
      for (const slide of slides) {
        const start = performance.now();
        while (performance.now() - start < slide.seconds * 1000) {
          await drawSlide(slide, (performance.now() - start) / (slide.seconds * 1000));
          await new Promise(requestAnimationFrame);
        }
      }
      recorder.stop(); await complete;
      const video = new Blob(chunks, { type:'video/webm' });
      const link = document.createElement('a'); link.href = URL.createObjectURL(video); link.download = 'genie-solutions-architect-overview.webm'; link.click(); URL.revokeObjectURL(link.href);
      status.textContent = 'Exported genie-solutions-architect-overview.webm'; exportButton.disabled = false;
    }
    exportButton.addEventListener('click', exportVideo); preview();
  </script>
</body>
</html>
