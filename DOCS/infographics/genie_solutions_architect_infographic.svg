<text x='86' y='76' class='kicker'>GOVERNED ARCHITECTURE INTELLIGENCE</text><text x='82' y='140' class='title'>GENIE SOLUTIONS ARCHITECT</text><text x='86' y='181' class='subtitle'>Keeps design decisions grounded in the platform you already have.</text>
<g filter='url(#lift)'><rect x='1002' y='54' width='330' height='152' rx='18' fill='#dbe976'/><text x='1032' y='104' class='metric'>MULTI-DOMAIN</text><text x='1032' y='130' class='metric-label'>GOVERNED ARCHITECTURE CONTEXT</text><text x='1032' y='165' class='body'>Assets, policies, lineage, workloads,<tspan x='1032' dy='19'>cost, knowledge, and demo scenarios.</tspan></text></g>
<text x='84' y='341' class='section'>HOW A REQUIREMENT BECOMES A REVIEWABLE DESIGN</text>
<g filter='url(#soft)'><rect x='58' y='374' width='290' height='288' rx='16' fill='#fff'/><rect x='58' y='374' width='290' height='9' rx='4' fill='#e57c59'/><image x='88' y='414' width='48' height='48' href='data:image/svg+xml;base64,'/><text x='88' y='491' class='card-title'>1. Ask in plain language</text><text x='88' y='523' class='body'>Submit a change request through Genie<tspan x='88' dy='21'>or the Solutions Architect App.</tspan></text></g>
<path d='M359 517 H388' stroke='#2c7b73' stroke-width='4' stroke-linecap='round'/><path d='M382 507 L400 517 L382 527' fill='none' stroke='#2c7b73' stroke-width='4'/>
<g filter='url(#soft)'><rect x='405' y='374' width='290' height='288' rx='16' fill='#fff'/><rect x='405' y='374' width='290' height='9' rx='4' fill='#3978a9'/><image x='435' y='414' width='48' height='48' href='data:image/svg+xml;base64,'/><text x='435' y='491' class='card-title'>2. Inspect real evidence</text><text x='435' y='523' class='body'>Assess assets, ownership, policies,<tspan x='435' dy='21'>lineage, cost, and operating signals.</tspan></text></g>
<path d='M706 517 H735' stroke='#2c7b73' stroke-width='4' stroke-linecap='round'/><path d='M729 507 L747 517 L729 527' fill='none' stroke='#2c7b73' stroke-width='4'/>
<g filter='url(#soft)'><rect x='752' y='374' width='290' height='288' rx='16' fill='#fff'/><rect x='752' y='374' width='290' height='9' rx='4' fill='#d8e96d'/><image x='782' y='414' width='48' height='48' href='data:image/svg+xml;base64,'/><text x='782' y='491' class='card-title'>3. Compare options</text><text x='782' y='523' class='body'>Use reviewed product knowledge and<tspan x='782' dy='21'>make tradeoffs explicit.</tspan></text></g>
<path d='M1053 517 H1082' stroke='#2c7b73' stroke-width='4' stroke-linecap='round'/><path d='M1076 507 L1094 517 L1076 527' fill='none' stroke='#2c7b73' stroke-width='4'/>
<g filter='url(#soft)'><rect x='1099' y='374' width='290' height='288' rx='16' fill='#fff'/><rect x='1099' y='374' width='290' height='9' rx='4' fill='#126b62'/><image x='1129' y='414' width='48' height='48' href='data:image/svg+xml;base64,'/><text x='1129' y='491' class='card-title'>4. Review</text><text x='1129' y='516' class='card-title'>proposal</text><text x='1129' y='551' class='body'>Inspect and approve<tspan x='1129' dy='21'>the next step.</tspan></text></g>
<rect x='82' y='724' width='1276' height='92' rx='14' fill='#143f42'/><text x='114' y='763' class='kicker'>THE SAFETY PROMISE</text><text x='114' y='793' class='subtitle'>Design outputs stay PENDING_APPROVAL. The system plans, explains, and visualizes. Humans decide what executes.</text><text x='84' y='862' class='footer'>DATABRICKS SOLUTIONS ARCHITECT | GOVERNED DIGITAL TWIN | REVIEWABLE BY DESIGN</text></svg>