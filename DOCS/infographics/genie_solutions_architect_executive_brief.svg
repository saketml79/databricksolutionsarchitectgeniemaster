<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1400' viewBox='0 0 1080 1400'>
<defs>
  <linearGradient id='paper' x1='0' y1='0' x2='1' y2='1'><stop stop-color='#fbfdf9'/><stop offset='1' stop-color='#e7f1ed'/></linearGradient>
  <linearGradient id='band' x1='0' y1='0' x2='1' y2='0'><stop stop-color='#0d514f'/><stop offset='1' stop-color='#16766b'/></linearGradient>
  <filter id='lift' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='9' stdDeviation='11' flood-color='#0a2d31' flood-opacity='.15'/></filter>
  <filter id='soft' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='4' stdDeviation='4' flood-color='#0a2d31' flood-opacity='.11'/></filter>
    <style>.kicker{font:700 12px 'Aptos Display','Segoe UI',sans-serif;letter-spacing:2.5px;fill:#72ddc2}.title{font:700 46px Georgia,'Times New Roman',serif;letter-spacing:.2px;fill:#fff}.subtitle{font:400 19px 'Aptos','Segoe UI',sans-serif;fill:#cce7df}.card-title{font:700 19px Georgia,'Times New Roman',serif;fill:#133a3d}.body{font:400 14px 'Aptos','Segoe UI',sans-serif;fill:#557174}.metric{font:700 31px Georgia,'Times New Roman',serif;fill:#113f41}.metric-label{font:700 11px Consolas,'Courier New',monospace;letter-spacing:1.35px;fill:#678184}.footer{font:400 11px Consolas,'Courier New',monospace;letter-spacing:.3px;fill:#6d8585}.section{font:700 12px 'Aptos Display','Segoe UI',sans-serif;letter-spacing:1.8px;fill:#16766b}</style>
</defs>
<rect width='100%' height='100%' fill='url(#paper)'/>
<rect x='48' y='44' width='984' height='1312' rx='8' fill='#fff' filter='url(#lift)'/><rect x='48' y='44' width='984' height='194' rx='8' fill='url(#band)'/>
<text x='98' y='95' class='kicker'>EXECUTIVE BRIEF</text><text x='94' y='153' class='title'>GENIE SOLUTIONS ARCHITECT</text><text x='98' y='190' class='subtitle'>A governed way to move from change request to decision.</text>
<text x='94' y='303' class='section'>THE IDEA</text><text x='94' y='350' class='metric'>Architecture that starts with facts.</text><text x='94' y='387' class='body'>Instead of designing from a blank canvas, the agent checks the governed platform<tspan x='94' dy='22'>twin: data products, dependencies, ownership, policies, operating signals, and cost.</tspan></text>
<line x1='94' y1='447' x2='986' y2='447' stroke='#d2dfda'/><text x='94' y='492' class='section'>WHAT IT KEEPS IN VIEW</text>
<g transform='translate(94,530)'><image x='0' y='0' width='42' height='42' href='data:image/svg+xml;base64,'/><text x='60' y='19' class='card-title'>Platform reality</text><text x='60' y='43' class='body'>Assets, data flows, and downstream impacts.</text></g>
<g transform='translate(94,618)'><image x='0' y='0' width='42' height='42' href='data:image/svg+xml;base64,'/><text x='60' y='19' class='card-title'>Governance</text><text x='60' y='43' class='body'>Ownership, classification, policy, and approval boundaries.</text></g>
<g transform='translate(94,706)'><image x='0' y='0' width='42' height='42' href='data:image/svg+xml;base64,'/><text x='60' y='19' class='card-title'>Current knowledge</text><text x='60' y='43' class='body'>Official documentation enters as candidate evidence before review.</text></g>
<g transform='translate(94,794)'><image x='0' y='0' width='42' height='42' href='data:image/svg+xml;base64,'/><text x='60' y='19' class='card-title'>Operations and cost</text><text x='60' y='43' class='body'>Pipelines, freshness, workload signals, and cost drivers.</text></g>
<rect x='94' y='895' width='892' height='256' rx='14' fill='#e8f4f0'/><text x='132' y='947' class='section'>THE REVIEW PACKAGE</text><text x='132' y='994' class='card-title'>Every recommendation becomes an inspectable record.</text><text x='132' y='1032' class='body'>Two or three options. Explicit tradeoffs. Migration and rollback steps.<tspan x='132' dy='22'>A draft IaC outline. Mermaid, SVG, and PNG diagrams. All marked for review.</tspan></text><rect x='132' y='1090' width='280' height='34' rx='17' fill='#d8e96d'/><text x='151' y='1113' class='metric-label'>PENDING_APPROVAL BY DEFAULT</text>
<text x='94' y='1235' class='section'>THE OUTCOME</text><text x='94' y='1283' class='metric'>Faster decisions. Better questions. Clearer accountability.</text><text x='94' y='1322' class='footer'>DATABRICKS SOLUTIONS ARCHITECT | FOR REVIEW, NOT AUTOMATIC EXECUTION</text></svg>