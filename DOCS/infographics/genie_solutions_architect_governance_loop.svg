<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
<defs>
  <linearGradient id='paper' x1='0' y1='0' x2='1' y2='1'><stop stop-color='#fbfdf9'/><stop offset='1' stop-color='#e7f1ed'/></linearGradient>
  <linearGradient id='band' x1='0' y1='0' x2='1' y2='0'><stop stop-color='#0d514f'/><stop offset='1' stop-color='#16766b'/></linearGradient>
  <filter id='lift' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='9' stdDeviation='11' flood-color='#0a2d31' flood-opacity='.15'/></filter>
  <filter id='soft' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='4' stdDeviation='4' flood-color='#0a2d31' flood-opacity='.11'/></filter>
    <style>.kicker{font:700 12px 'Aptos Display','Segoe UI',sans-serif;letter-spacing:2.5px;fill:#72ddc2}.title{font:700 46px Georgia,'Times New Roman',serif;letter-spacing:.2px;fill:#fff}.subtitle{font:400 19px 'Aptos','Segoe UI',sans-serif;fill:#cce7df}.card-title{font:700 19px Georgia,'Times New Roman',serif;fill:#133a3d}.body{font:400 14px 'Aptos','Segoe UI',sans-serif;fill:#557174}.metric{font:700 31px Georgia,'Times New Roman',serif;fill:#113f41}.metric-label{font:700 11px Consolas,'Courier New',monospace;letter-spacing:1.35px;fill:#678184}.footer{font:400 11px Consolas,'Courier New',monospace;letter-spacing:.3px;fill:#6d8585}.section{font:700 12px 'Aptos Display','Segoe UI',sans-serif;letter-spacing:1.8px;fill:#16766b}</style>
</defs>
<rect width='100%' height='100%' fill='url(#paper)'/>
<rect width='1200' height='900' fill='#f7fbf8'/><rect x='0' y='0' width='1200' height='176' fill='url(#band)'/><text x='64' y='59' class='kicker'>A CONTROLLED FEEDBACK LOOP</text><text x='60' y='118' class='title'>GENIE SOLUTIONS ARCHITECT KEEPS</text><text x='64' y='151' class='subtitle'>context current, recommendations grounded, and execution reviewable.</text>
<circle cx='600' cy='537' r='203' fill='#e6f2ed' stroke='#b7d4ca' stroke-width='2'/><circle cx='600' cy='537' r='110' fill='#143f42' filter='url(#lift)'/><image x='564' y='470' width='72' height='72' href='data:image/svg+xml;base64,'/><text x='600' y='570' text-anchor='middle' style='font:700 18px Arial,sans-serif;fill:#fff'>GROUNDED</text><text x='600' y='594' text-anchor='middle' style='font:400 13px Arial,sans-serif;fill:#cce7df'>design reasoning</text>
<g filter='url(#soft)'><rect x='87' y='380' width='246' height='150' rx='16' fill='#fff'/><image x='117' y='411' width='38' height='38' href='data:image/svg+xml;base64,'/><text x='117' y='475' class='card-title'>Discover</text><text x='117' y='501' class='body'>Inventory assets, flows,<tspan x='117' dy='18'>workloads, and costs.</tspan></text></g>
<g filter='url(#soft)'><rect x='867' y='380' width='246' height='150' rx='16' fill='#fff'/><image x='897' y='411' width='38' height='38' href='data:image/svg+xml;base64,'/><text x='897' y='475' class='card-title'>Govern</text><text x='897' y='501' class='body'>Apply ownership, policy,<tspan x='897' dy='18'>and semantic contracts.</tspan></text></g>
<g filter='url(#soft)'><rect x='172' y='665' width='246' height='150' rx='16' fill='#fff'/><image x='202' y='696' width='38' height='38' href='data:image/svg+xml;base64,'/><text x='202' y='760' class='card-title'>Enrich</text><text x='202' y='786' class='body'>Review current product<tspan x='202' dy='18'>knowledge and limits.</tspan></text></g>
<g filter='url(#soft)'><rect x='782' y='665' width='246' height='150' rx='16' fill='#fff'/><image x='812' y='696' width='38' height='38' href='data:image/svg+xml;base64,'/><text x='812' y='760' class='card-title'>Review</text><text x='812' y='786' class='body'>Compare options and<tspan x='812' dy='18'>approve the next step.</tspan></text></g>
<path d='M333 454 C390 350 462 324 506 363' fill='none' stroke='#2c7b73' stroke-width='4' marker-end='url(#arrow)'/><path d='M694 363 C759 324 831 350 867 454' fill='none' stroke='#2c7b73' stroke-width='4' marker-end='url(#arrow)'/><path d='M986 530 C1016 595 959 655 900 680' fill='none' stroke='#2c7b73' stroke-width='4' marker-end='url(#arrow)'/><path d='M300 680 C241 655 184 595 214 530' fill='none' stroke='#2c7b73' stroke-width='4' marker-end='url(#arrow)'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#2c7b73'/></marker></defs><text x='60' y='860' class='footer'>AUTOMATION PREPARES CONTEXT. PEOPLE RETAIN APPROVAL AUTHORITY.</text></svg>